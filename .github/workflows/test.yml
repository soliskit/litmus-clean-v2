name: Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '20 7 * * 6'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces a run still in progress.
# Scheduled and manual runs use a separate group so they never cancel
# or replace push or pull request runs, queued or running
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '-weekly' || '' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
      - run: pip install ruff==0.17.4
      - run: ruff check .
      - run: ruff format --check .
      - run: pip install mypy==2.4.1
      - run: mypy
      - run: python3 -m unittest discover -s tests -p test_staging_regressions.py
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
      - run: python3 checks.py
      - run: RECORDER_CHECKS_SKIP=R10 python3 recorder-checks.py
