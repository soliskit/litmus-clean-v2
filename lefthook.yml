glob_matcher: doublestar
pre-commit:
  commands:
    python-lint:
      glob: "**/*.py"
      run: ruff check -- {staged_files}
    python-format:
      glob: "**/*.py"
      run: ruff format --check -- {staged_files}
    python-types:
      # Whole project, once per commit: mypy reads its file list from mypy.ini.
      run: mypy

# Exact commit metadata checks, alongside existing checks.
commit-msg:
  commands:
    credit-message:
      run: python3 "$(git rev-parse --git-path credit-guard/entry.py)" commit-msg {1}
